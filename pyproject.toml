[project]
name = "ip"
version = "0.1.0"
description = "YZM505 take-home: image enhancement, geometric transforms, manual bilinear resize"
authors = [
    { name = "Emre Yilmaz", email = "emreyilmaz.developer@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "scikit-image>=0.26.0",
    "tifffile>=2026.10.15",
]

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "python-docx>=1.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
ignore = ["E741", "E501"]  # satır uzunluğu ruff format ile yönetilir; uzun string/yorumlar serbest

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
